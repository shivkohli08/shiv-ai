<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SHIV AI</title><style>
*{box-sizing:border-box}body{margin:0;background:#eef1f7;font-family:Arial;color:#172033}.app{max-width:600px;margin:auto;min-height:100vh;background:#fff;display:flex;flex-direction:column}header{padding:20px;background:linear-gradient(135deg,#4f46e5,#7c3aed);color:#fff;border-radius:0 0 22px 22px}.logo{font-size:28px;font-weight:800}.tag{margin-top:5px}.tools{display:grid;grid-template-columns:repeat(4,1fr);gap:7px;padding:11px}.tool{border:0;background:#f0f2ff;border-radius:13px;padding:10px 3px;color:#4238ca}.mode{margin:0 11px 7px;padding:9px;background:#f7f7fa;border-radius:12px;display:flex;justify-content:space-between;gap:8px}.chat{flex:1;padding:12px;overflow:auto}.welcome{text-align:center;padding:25px 8px;color:#667085}.msg{max-width:90%;padding:12px 14px;margin:9px 0;border-radius:16px;line-height:1.5;white-space:pre-wrap;overflow-wrap:anywhere}.user{margin-left:auto;background:#4f46e5;color:#fff}.ai{background:#eef0f4}.preview{max-width:180px;max-height:180px;border-radius:12px;margin-top:8px}.composer{border-top:1px solid #e5e7eb;padding:10px}.row{display:flex;gap:7px}.input{flex:1;min-width:0;padding:12px;border:1px solid #d4d8e2;border-radius:18px;font-size:15px}.send{border:0;background:#4f46e5;color:#fff;border-radius:18px;padding:0 16px;font-size:18px}.small{text-align:center;color:#8a91a1;font-size:11px;margin-top:6px}.secondary{border:0;background:#f1f3f8;border-radius:10px;padding:7px}</style></head><body><div class="app"><header><div class="logo">🤖 SHIV AI</div><div class="tag">Ask Anything. Learn Everything.</div></header>
<div class="tools"><button class="tool" onclick="document.getElementById('photo').click()">📷<br>Photo</button><button class="tool" onclick="voice()">🎤<br>Voice</button><button class="tool" onclick="setMode('Student')">📚<br>Student</button><button class="tool" onclick="setMode('General')">🌐<br>General</button></div><input id="photo" type="file" accept="image/*" capture="environment" hidden onchange="pick(event)">
<div class="mode"><span>Mode: <b id="md">Student</b></span><span>Language <select id="lang"><option>Hindi</option><option>English</option></select></span><button class="secondary" onclick="clearChat()">Clear</button></div>
<main id="chat" class="chat"><div class="welcome"><h2>Welcome to SHIV AI 👋</h2><p>Text, photo or voice question पूछें.</p><p>Maths • Physics • Chemistry • English • General Knowledge</p></div></main>
<div class="composer"><div class="row"><input id="q" class="input" placeholder="Ask SHIV AI..." onkeydown="if(event.key==='Enter')send()"><button class="send" onclick="send()">➤</button></div><div class="small">AI answers • Local chat history • Mobile-friendly</div></div></div>
<script>
const chat=document.getElementById("chat"),q=document.getElementById("q"),photo=document.getElementById("photo");let img=null,md="Student",busy=false;
function clean(){let w=chat.querySelector(".welcome");if(w)w.remove()}function add(t,c,im){clean();let d=document.createElement("div");d.className="msg "+c;d.textContent=t;if(im){let x=document.createElement("img");x.src=im;x.className="preview";d.append(document.createElement("br"),x)}chat.appendChild(d);chat.scrollTop=chat.scrollHeight}
function setMode(x){md=x;document.getElementById("md").textContent=x}
function pick(e){let f=e.target.files[0];if(!f)return;if(f.size>5*1024*1024){alert("Choose an image under 5 MB.");return}let r=new FileReader();r.onload=()=>{img=r.result;add("📷 Image selected","user",img);if(!q.value)q.value="Solve this question from the image step by step."};r.readAsDataURL(f)}
function voice(){let S=window.SpeechRecognition||window.webkitSpeechRecognition;if(!S){alert("Voice input not supported here. Try Chrome.");return}let r=new S();r.lang=document.getElementById("lang").value==="Hindi"?"hi-IN":"en-IN";r.onresult=e=>q.value=e.results[0][0].transcript;r.start()}
function clearChat(){chat.innerHTML='<div class="welcome"><h2>Welcome to SHIV AI 👋</h2><p>Ask a question to begin.</p></div>';localStorage.removeItem("shiv_ai_history")}
function save(role,text){try{let h=JSON.parse(localStorage.getItem("shiv_ai_history")||"[]");h.push({role,text});localStorage.setItem("shiv_ai_history",JSON.stringify(h.slice(-80)))}catch(e){}}
async function send(){let text=q.value.trim();if((!text&&!img)||busy)return;add(text||"Solve this image","user",img);save("user",text);q.value="";let sentImg=img;img=null;photo.value="";busy=true;let loading=document.createElement("div");loading.className="msg ai";loading.textContent="SHIV AI is thinking...";chat.appendChild(loading);try{let r=await fetch("/api/ask",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({question:text,image:sentImg,language:document.getElementById("lang").value,mode:md})});let d=await r.json();if(!r.ok)throw Error(d.error||"Request failed");loading.remove();add(d.answer||"No answer returned.","ai");save("assistant",d.answer||"")}catch(e){loading.remove();add("Could not get an answer: "+e.message+"\n\nCheck server setup and API key.","ai")}finally{busy=false}}
try{let h=JSON.parse(localStorage.getItem("shiv_ai_history")||"[]");if(h.length){clean();h.slice(-20).forEach(m=>add(m.text,m.role==="user"?"user":"ai"))}}catch(e){}
</script></body></html>
